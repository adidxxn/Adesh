<style>

body{
    margin:0;
    height:100vh;
    background:#ffffff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding-right:40px;
}

.main-box{
    width:320px;
    padding:20px;
    border:2px solid #ddd;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    text-align:center;
    background:#fff;
}

.title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

input{
    padding:10px;
    width:100%;
    border:2px solid #000;
    border-radius:6px;
    margin-bottom:15px;
    box-sizing:border-box;
}

input:focus{
    outline:none;
    box-shadow:none;
    border:2px solid #000;
}

.qr-container{
    position:relative;
    display:none;
}

#qrcode{
    padding:10px;
    background:#fff;
    border:1px solid #000;
    display:inline-block;
}

.qr-logo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:55px;
    height:55px;
    background:#fff;
    padding:5px;
    border-radius:8px;
    display:none;
}

.qr-text{
    margin-top:8px;
    font-size:12px;
    font-weight:bold;
    background:#353835;
    color:#00FF00;
    word-break:break-all;
    padding:2px;
}

.datetime-box{
    margin-top:12px;
    font-size:13px;
    font-weight:bold;
    color:#333;
    line-height:1.8;
}

#mpnImage{
    display:none;
    width:220px;
    margin:10px auto 0 auto;
    border:1px solid #ccc;
    border-radius:8px;
}

.copyright{
    position:fixed;
    bottom:0;
    width:100%;
    text-align:right;
    font-size:11px;
    color:#BLUE;       
    padding:6px 20px;
    border-top:1px solid #ccc;
    background:#fff;
}
</style>

</head>

<input type="text"

       autofocus

<div class="qr-container" id="qrContainer">
    <div id="qrcode"></div>
    <img src="adesh1.png" id="logo" class="qr-logo">
</div>

<div class="qr-text" id="bottomText"></div>

<div class="datetime-box" id="currentDateTime"></div>

<div id="partInfo" class="datetime-box" style="display:none;"></div>

let imageTimer;
let currentImageIndex = 0;

function generateQR(){

    let text = document.getElementById("text").value.trim();
    let qr = document.getElementById("qrcode");
    let logo = document.getElementById("logo");
    let qrBox = document.getElementById("qrContainer");
    let mpnImg = document.getElementById("mpnImage");
    let dateTime = document.getElementById("currentDateTime");
    let partInfo = document.getElementById("partInfo");

    qr.innerHTML = "";

    clearInterval(imageTimer);

    if(text === ""){

        qrBox.style.display = "none";
        logo.style.display = "none";
        mpnImg.style.display = "none";
        partInfo.style.display = "none";
        dateTime.style.display = "block";

        document.getElementById("bottomText").innerText = "";
        return;
    }

    qrBox.style.display = "inline-block";

    new QRCode(qr,{
        text:text,
        width:200,
        height:200,
        colorDark:"#000000",
        colorLight:"#ffffff",
        correctLevel:QRCode.CorrectLevel.H
    });

    logo.style.display = "block";

    document.getElementById("bottomText").innerText =
        "MPN → " + text;

    if(partMap[text]){

partInfo.innerHTML =
    "<div style='text-align:center'>" +
    "<b>DESCRIPTION → </b><br>" +
    partMap[text].description +
    "</div>";
        partInfo.style.display = "block";

        dateTime.style.display = "none";

        currentImageIndex = 0;

        mpnImg.src = partMap[text].images[currentImageIndex];
        mpnImg.style.display = "block";

        imageTimer = setInterval(function(){

            currentImageIndex++;

            if(currentImageIndex >= partMap[text].images.length){
                currentImageIndex = 0;
            }

            mpnImg.src = partMap[text].images[currentImageIndex];

        },20000);

    }else{

        partInfo.style.display = "none";
        mpnImg.style.display = "none";
        dateTime.style.display = "block";
    }
}

function updateDateTime(){

    const now = new Date();

    const days = [
        "SUNDAY",
        "MONDAY",
        "TUESDAY",
        "WEDNESDAY",
        "THURSDAY",
        "FRIDAY",
        "SATURDAY"
    ];

    const day = days[now.getDay()];

    const date = now.toLocaleDateString("en-GB");

    const time = now.toLocaleTimeString("en-US",{
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
    });

    document.getElementById("currentDateTime").innerHTML =
        "📅 " + day + "<br>" +
        "📆 " + date + "<br>" +
        "⏰ " + time;
}

updateDateTime();
setInterval(updateDateTime,1000);
window.onload = function(){
    document.getElementById("text").focus();
};
